services:
  errandmate-api:
    build: .
    container_name: errandmate_server
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - DATABASE_PATH=/data/ErrandMate.db
      # Set SECRET_KEY in your shell or a .env file; never commit a real key.
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY before running docker compose}
    volumes:
      - errandmate-data:/data
    restart: unless-stopped

volumes:
  errandmate-data:
